name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The project targets 17; every later LTS runs too, so the "Java 17+" claim
        # is tested, not asserted.
        java: [ '17', '21', '25' ]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build, test and enforce the coverage floor
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload coverage report
        if: matrix.java == '17'
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          if-no-files-found: error
