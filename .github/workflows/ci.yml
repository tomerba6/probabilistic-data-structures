name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The project targets 17; every later LTS runs too, so the "Java 17+" claim
        # is tested, not asserted.
        java: [ '17', '21', '25' ]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build, test and enforce the coverage floor
        run: ./mvnw -B --no-transfer-progress verify

      # verify writes the test report itself, but a failing test stops the build first. Then it is
      # written from the results the tests left. With no results (the build failed before any test
      # ran) there is nothing to report, and an empty report would read as "0 tests".
      - name: Write the test report after a failed build
        if: ${{ failure() && hashFiles('target/surefire-reports/TEST-*.xml') != '' }}
        run: ./mvnw -B --no-transfer-progress surefire-report:report-only

      # Every JDK uploads its own, since a test can fail on one JDK only.
      - name: Upload test report
        if: ${{ !cancelled() && hashFiles('target/surefire-reports/TEST-*.xml') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-report-jdk${{ matrix.java }}
          path: target/reports/
          if-no-files-found: error

      - name: Upload coverage report
        if: matrix.java == '17'
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          if-no-files-found: error
